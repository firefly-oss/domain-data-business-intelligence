name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release:
    uses: fireflysoftwaresolutions/.github/.github/workflows/java-release.yml@main
    permissions:
      contents: write
      packages: write
    with:
      java-version: '25'
      destination: both
      deploy-modules: ':domain-data-business-intelligence-sdk'
    secrets: inherit
