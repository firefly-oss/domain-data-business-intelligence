name: Maven Central

on:
  workflow_dispatch:

jobs:
  maven-central:
    uses: fireflysoftwaresolutions/.github/.github/workflows/java-release.yml@main
    permissions:
      contents: read
    with:
      java-version: '25'
      destination: central
      deploy-modules: '.,:domain-data-business-intelligence-core,:domain-data-business-intelligence-interfaces,:domain-data-business-intelligence-web,:domain-data-business-intelligence-infra'
    secrets: inherit
